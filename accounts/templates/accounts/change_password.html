{% extends 'diario/base.html' %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block content %}
<h1>🔒 Cambiar Contraseña</h1>

<form method="POST">
    {% csrf_token %}
    
    <p>Contraseña actual:<br>
    <input type="password" name="old_password" required></p>
    
    <p>Nueva contraseña:<br>
    <input type="password" name="new_password" required></p>
    
    <p>Confirmar nueva contraseña:<br>
    <input type="password" name="confirm_password" required></p>
    
    <button type="submit">💾 Cambiar Contraseña</button>
    <a href="{% url 'profile' %}" class="boton" style="background: #6c757d;">❌ Cancelar</a>
</form>
{% endblock %}
